<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<style>
  /* topic colors from _config.yml */
  {% for t in site.topic_colors %}[data-t="{{ t[0] }}"]{--tc:{{ t[1] }}}
  {% endfor %}
</style>
</head>
<body>
<header class="mast">
  <a class="title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
</header>
<nav class="sections">
  <a href="{{ '/' | relative_url }}" data-f="all" {% if page.url == '/' %}class="on"{% endif %}>All</a>
  {% assign topics = site.posts | map: "topic" | uniq | sort %}
  {% for t in topics %}<a href="{{ '/' | relative_url }}#{{ t }}" data-f="{{ t }}" data-t="{{ t }}">{{ t }}</a>{% endfor %}
  <span class="sp"></span>
  <a href="{{ '/notes/' | relative_url }}" {% if page.url contains '/notes/' %}class="on"{% endif %}>Notes</a>
  <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="on"{% endif %}>About</a>
</nav>
<main class="wrap">
{{ content }}
</main>
<footer class="foot">
  <span>{{ site.title }}</span>
  <span><a href="{{ '/feed.xml' | relative_url }}">rss</a></span>
</footer>
</body>
</html>

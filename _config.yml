# Site
title: My URL
description: A compilation of things to know. Thoughts, pictures, quotes, notes.
url: "https://chaos-ow.github.io"
baseurl: "/MyURL"          # change to "" if this becomes the root site or gets a custom domain
author: CHAOS
lang: en

# URLs mirror the old WordPress ones (/2016/01/02/just-do-it/) so old links can be redirected 1:1
permalink: /:year/:month/:day/:title/
timezone: America/Los_Angeles

# Notes: undated reference pages. _notes/<section>/<name>.md -> /notes/<section>/<name>/
collections:
  notes:
    output: true
    permalink: /notes/:path/

excerpt_separator: "\n\n"
defaults:
  - scope: {path: "", type: posts}
    values: {layout: post, related: []}
  - scope: {path: "", type: notes}
    values: {layout: note, related: []}

# Topic colors (Icelandic palette). Any topic/section not listed falls back to ink.
topic_colors:
  thoughts: "#2E4B58"
  photo:    "#B0282C"
  finance:  "#3F672B"
  health:   "#696405"
  quotes:   "#B0282C"
  drk:      "#2E4B58"
  ballet:   "#696405"
  making:   "#5E889B"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: feed.xml

markdown: kramdown
kramdown: {input: GFM, hard_wrap: false, auto_ids: true}

exclude: [_import, Gemfile, Gemfile.lock, README.md, vendor, node_modules]
